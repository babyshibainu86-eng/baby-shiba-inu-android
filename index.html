<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050608">

    <title>Baby Shiba Inu | $BSHIB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #050608;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           INTRO
        ========================= */

        .intro {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050608;

            padding: 24px;
            text-align: center;
        }

        .intro-content {
            width: 100%;
            max-width: 380px;
        }

        .intro-logo {
            display: block;

            width: 210px;
            height: 210px;

            object-fit: contain;

            margin: 0 auto 22px;
        }

        .intro h1 {
            font-size: 32px;
            line-height: 1.2;

            margin-bottom: 10px;
        }

        .intro-subtitle {
            font-size: 16px;
            opacity: 0.65;

            margin-bottom: 32px;
        }

        .play-button {
            display: block;

            width: 100%;
            max-width: 300px;

            margin: 0 auto;

            padding: 16px 20px;

            border: 0;
            border-radius: 16px;

            background: #ffffff;
            color: #050608;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .play-button:active {
            transform: scale(0.98);
        }

        /* =========================
           MAIN APP
        ========================= */

        .app {
            width: 100%;
            max-width: 480px;

            min-height: 100vh;

            margin: 0 auto;

            padding: 20px 16px 105px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        .ticker {
            font-size: 13px;
            opacity: 0.65;
        }

        /* =========================
           BALANCE
        ========================= */

        .balance-card {
            background: #111318;

            border-radius: 20px;

            padding: 20px;

            text-align: center;

            margin-bottom: 18px;
        }

        .balance-label {
            font-size: 12px;
            opacity: 0.55;

            margin-bottom: 8px;
        }

        .balance {
            font-size: 30px;
            font-weight: bold;
        }

        /* =========================
           MINING COIN
        ========================= */

        .coin-area {
            text-align: center;

            padding: 15px 0 10px;
        }

        .coin {
            display: block;

            width: 190px;
            height: 190px;

            margin: 0 auto;

            object-fit: contain;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            transition: transform 0.08s ease;
        }

        .coin:active {
            transform: scale(0.94);
        }

        .tap-text {
            margin-top: 12px;

            font-size: 13px;

            opacity: 0.55;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            margin-top: 18px;
        }

        .stat {
            background: #111318;

            border-radius: 16px;

            padding: 15px;
        }

        .stat-title {
            font-size: 11px;

            opacity: 0.55;

            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 16px;

            font-weight: bold;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            width: 100%;
            max-width: 480px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 1px;

            padding: 8px;

            background: #0b0c10;

            border-top: 1px solid #22242a;

            z-index: 500;
        }

        .nav-button {
            border: 0;

            background: transparent;

            color: #ffffff;

            padding: 9px 3px;

            font-size: 11px;

            opacity: 0.65;

            cursor: pointer;
        }

        .nav-button.active {
            opacity: 1;

            font-weight: bold;
        }

        /* =========================
           HIDDEN
        ========================= */

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- =========================
         INTRO SCREEN
    ========================= -->

    <section class="intro" id="introPage">

        <div class="intro-content">

            <img
                class="intro-logo"
                src="assets/bshib-logo.png"
                alt="Baby Shiba Inu $BSHIB"
            >

            <h1>
                Baby Shiba Inu
            </h1>

            <p class="intro-subtitle">
                Mine • Upgrade • Explore
            </p>

            <button
                type="button"
                class="play-button"
                id="startGame"
            >
                PLAY NOW
            </button>

        </div>

    </section>


    <!-- =========================
         MAIN APP
    ========================= -->

    <main class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="brand">
                Baby Shiba Inu
            </div>

            <div class="ticker">
                $BSHIB
            </div>

        </header>


        <!-- BALANCE -->

        <section class="balance-card">

            <div class="balance-label">
                BALANCE
            </div>

            <div
                class="balance"
                id="balance"
            >
                0 BSHIB
            </div>

        </section>


        <!-- MINING -->

        <section class="coin-area">

            <img
                class="coin"
                id="miningCoin"
                src="assets/bshib-logo.png"
                alt="BSHIB Mining Coin"
            >

            <div class="tap-text">
                Tap to mine BSHIB
            </div>

        </section>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">

                <div class="stat-title">
                    MINING RATE
                </div>

                <div class="stat-value">
                    <span id="rate">1</span>
                    BSHIB/s
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    ENERGY
                </div>

                <div class="stat-value">
                    <span id="energy">1000</span>
                    / 1000
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    LEVEL
                </div>

                <div class="stat-value">
                    <span id="level">1</span>
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    TOTAL MINED
                </div>

                <div class="stat-value">
                    <span id="totalMined">0</span>
                    BSHIB
                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================= -->

    <nav class="bottom-nav">

        <button
            type="button"
            class="nav-button active"
            data-page="mining"
        >
            ⛏️ Mining
        </button>

        <button
            type="button"
            class="nav-button"
            data-page="items"
        >
            🎒 Items
        </button>

        <button
            type="button"
            class="nav-button"
            data-page="shop"
        >
            🛒 Shop
        </button>

        <button
            type="button"
            class="nav-button"
            data-page="vip"
        >
            👑 VIP
        </button>

        <button
            type="button"
            class="nav-button"
            data-page="friends"
        >
            👥 Friends
        </button>

        <button
            type="button"
            class="nav-button"
            data-page="arena"
        >
            ⚔️ Arena
        </button>

    </nav>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /*
         * Baby Shiba Inu
         * Android/Web prototype
         *
         * IMPORTANT:
         * This is only local demo data.
         * Backend/Supabase will be connected later.
         */

        let balance = 0;

        let totalMined = 0;

        let energy = 1000;

        const maxEnergy = 1000;

        let level = 1;

        let rate = 1;


        /* =========================
           ELEMENTS
        ========================= */

        const introPage =
            document.getElementById("introPage");

        const startGameButton =
            document.getElementById("startGame");

        const miningCoin =
            document.getElementById("miningCoin");

        const balanceElement =
            document.getElementById("balance");

        const totalMinedElement =
            document.getElementById("totalMined");

        const energyElement =
            document.getElementById("energy");

        const levelElement =
            document.getElementById("level");

        const rateElement =
            document.getElementById("rate");


        /* =========================
           START GAME
        ========================= */

        function startGame() {

            introPage.classList.add("hidden");

        }


        /* =========================
           MINING
        ========================= */

        function mine() {

            if (energy <= 0) {

                return;

            }

            balance += rate;

            totalMined += rate;

            energy -= 1;

            updateScreen();

        }


        /* =========================
           UPDATE SCREEN
        ========================= */

        function updateScreen() {

            balanceElement.textContent =
                balance + " BSHIB";

            totalMinedElement.textContent =
                totalMined;

            energyElement.textContent =
                energy;

            levelElement.textContent =
                level;

            rateElement.textContent =
                rate;

        }


        /* =========================
           BUTTON EVENTS
        ========================= */

        startGameButton.addEventListener(
            "click",
            startGame
        );


        miningCoin.addEventListener(
            "click",
            mine
        );


        /* =========================
           INITIAL SCREEN
        ========================= */

        updateScreen();

    </script>

</body>
  </html>
