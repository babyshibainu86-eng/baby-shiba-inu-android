<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050608">

    <title>Baby Shiba Inu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050608;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            width: 190px;
            height: 190px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .ticker {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .tagline {
            font-size: 17px;
            opacity: 0.8;
            margin-bottom: 35px;
        }

        .play-button {
            width: 100%;
            max-width: 300px;
            padding: 17px;
            border: none;
            border-radius: 16px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #050608;
        }

        .version {
            position: absolute;
            bottom: 18px;
            font-size: 12px;
            opacity: 0.45;
        }
    </style>
</head>

<body>

<div class="app">

    <img
        class="logo"
        src="assets/bshib-logo.png"
        alt="Baby Shiba Inu"
    >

    <h1>Baby Shiba Inu</h1>

    <div class="ticker">$BSHIB</div>

    <div class="tagline">
        Play. Own. Rise.
    </div>

    <button class="play-button" onclick="startGame()">
        PLAY NOW
    </button>

    <div class="version">
        Baby Shiba Inu v1.0
    </div>

</div>

<script>
function startGame() {
    alert("Baby Shiba Inu is starting...");
}
</script>

</body>
  </html>
