<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050608">

    <title>Baby Shiba Inu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050608;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: auto;
            padding: 22px 16px 90px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
        }

        .ticker {
            opacity: 0.7;
            font-size: 13px;
        }

        .balance-card {
            text-align: center;
            padding: 20px;
            border-radius: 20px;
            background: #111318;
            margin-bottom: 18px;
        }

        .balance-label {
            opacity: 0.6;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .balance {
            font-size: 30px;
            font-weight: bold;
        }

        .coin-area {
            text-align: center;
            padding: 20px 0;
        }

        .coin {
            width: 190px;
            height: 190px;
            object-fit: contain;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.08s;
        }

        .coin:active {
            transform: scale(0.94);
        }

        .tap-text {
            margin-top: 12px;
            opacity: 0.55;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat {
            background: #111318;
            border-radius: 16px;
            padding: 15px;
        }

        .stat-title {
            font-size: 12px;
            opacity: 0.55;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 17px;
            font-weight: bold;
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #0b0c10;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            padding: 8px;
            border-top: 1px solid #22242a;
        }

        .nav button {
            background: transparent;
            border: none;
            color: white;
            padding: 9px 3px;
            font-size: 11px;
            opacity: 0.75;
        }

        .nav button.active {
            opacity: 1;
            font-weight: bold;
        }

        .intro {
            position: fixed;
            inset: 0;
            background: #050608;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .intro-content {
            width: 100%;
            max-width: 380px;
        }

        .intro-logo {
            width: 210px;
            height: 210px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .intro h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .intro p {
            opacity: 0.65;
            margin-bottom: 30px;
        }

        .play {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="introPage">

    <div class="intro-content">

        <img
            class="intro-logo"
            src="assets/bshib-logo.png"
            alt="Baby Shiba Inu"
        >

        <h1>Baby Shiba Inu</h1>

        <p>
            Mine • Upgrade • Explore
        </p>

        <button class="play" onclick="startGame()">
            PLAY NOW
        </button>

    </div>

</div>


<!-- MAIN GAME -->
<div class="page">

    <div class="header">
        <div class="brand">
            Baby Shiba Inu
        </div>

        <div class="ticker">
            $BSHIB
        </div>
    </div>


    <div class="balance-card">

        <div class="balance-label">
            BALANCE
        </div>

        <div class="balance" id="balance">
            0 BSHIB
        </div>

    </div>


    <div class="coin-area">

        <img
            class="coin"
            src="assets/bshib-logo.png"
            alt="BSHIB"
            onclick="mine()"
        >

        <div class="tap-text">
            Tap to mine BSHIB
        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                MINING RATE
            </div>

            <div class="stat-value">
                <span id="rate">1</span> BSHIB/s
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                ENERGY
            </div>

            <div class="stat-value">
                <span id="energy">1000</span> / 1000
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                LEVEL
            </div>

            <div class="stat-value">
                <span id="level">1</span>
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                TOTAL MINED
            </div>

            <div class="stat-value">
                <span id="totalMined">0</span>
            </div>

        </div>

    </div>

</div>


<!-- NAVIGATION -->
<div class="nav">

    <button class="active">
        ⛏️ Mining
    </button>

    <button>
        🎒 Items
    </button>

    <button>
        🛒 Shop
    </button>

    <button>
        👑 VIP
    </button>

    <button>
        👥 Friends
    </button>

    <button>
        ⚔️ Arena
    </button>

</div>


<script>

let balance = 0;
let totalMined = 0;
let energy = 1000;
let level = 1;
let rate = 1;


function startGame() {

    document.getElementById("introPage").style.display = "none";

}


function mine() {

    if (energy <= 0) {
        return;
    }

    balance += rate;
    totalMined += rate;
    energy--;

    updateScreen();

}


function updateScreen() {

    document.getElementById("balance").textContent =
        balance + " BSHIB";

    document.getElementById("totalMined").textContent =
        totalMined;

    document.getElementById("energy").textContent =
        energy;

    document.getElementById("level").textContent =
        level;

    document.getElementById("rate").textContent =
        rate;

}

</script>

</body>
    </html>
